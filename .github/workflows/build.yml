name: build
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Latest go2rtc release
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/AlexxIT/go2rtc/releases/latest --jq .tag_name)
          echo "ver=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: VER=${{ steps.v.outputs.ver }}
          tags: ghcr.io/${{ steps.v.outputs.owner }}/go2rtc-addon-aarch64:${{ steps.v.outputs.ver }}
      - name: Bump add-on version
        run: |
          sed -i "s/^version: .*/version: ${{ steps.v.outputs.ver }}/" go2rtc_mdns/config.yaml
          if ! git diff --quiet; then
            git config user.name github-actions
            git config user.email actions@github.com
            git commit -am "go2rtc ${{ steps.v.outputs.ver }}"
            git push
          fi
